[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabs"
version = "0.1.0"
description = "AppSec & AI Security knowledge base"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tabs = "tabs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
